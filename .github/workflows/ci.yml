name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The index and the images are committed, so these run against exactly what deploys.
      - name: Typecheck
        run: npm run typecheck

      - name: Index integrity and recipe fixture
        run: npm test

      - name: Static export
        run: npm run build
